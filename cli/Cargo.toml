[package]
name = "proxy-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
uuid = { workspace = true, features = ["v7"] }
anyhow = "1.0.102"
rustix = { version = "1.1.4", features = ["fs", "process"] }
tokio.workspace = true
tempfile = "3.27.0"
rusqlite = { version = "0.39.0", features = ["uuid"] }
proxy-core = { version = "0.1.0", path = "../core" }
conn-tester = { version = "0.1.0", path = "../conn-tester" }
url-parser = { path = "../url-parser" }
rand = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
yansi = "1.0.1"
chrono = "0.4.44"
http.workspace = true
